[project]
name = "lochness-hardware"
version = "0.1.0"
description = "Mechanical CAD for the lochness lock unit: door/deadbolt fixture and enclosures"
requires-python = ">=3.12,<3.14"
license = "CERN-OHL-S-2.0"
dependencies = ["build123d>=0.10"]

[dependency-groups]
dev = ["pytest>=8", "ocp_vscode~=4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
